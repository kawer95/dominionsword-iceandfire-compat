plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral {
        content {
            includeGroup('org.spongepowered')
            includeGroup('org.junit.jupiter')
            includeGroup('org.junit.platform')
            includeGroup('org.apiguardian')
            includeGroup('org.opentest4j')
        }
    }
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroupByRegex('net\\.minecraftforge(\\..*)?') }
    }
}

def requiredLocalJar = { String property, String checksumProperty ->
    if (!project.hasProperty(property)) throw new GradleException("Missing -P${property}")
    File jar = file(project.property(property))
    if (!jar.isFile()) throw new GradleException("Local dependency ${property} is not a file: ${jar}")
    def expected = checksumProperty == null ? null : project.findProperty(checksumProperty)?.toString()?.toLowerCase(Locale.ROOT)
    [property: property, file: jar, expected: expected]
}
def localJars = [
        requiredLocalJar('dominionsword_jar', null),
        requiredLocalJar('iaf_jar', 'iaf_sha256'),
        requiredLocalJar('uranus_jar', 'uranus_sha256')
]

tasks.register('verifyLocalDependencies') {
    group = 'verification'
    description = 'Verifies SHA-256 locks for stable third-party dependencies; Dominion Sword intentionally tracks the supplied build.'
    inputs.files(localJars.collect { it.file })
    doLast {
        localJars.each { entry ->
            if (entry.expected == null) return
            if (!(entry.expected ==~ /[0-9a-f]{64}/)) {
                throw new GradleException("Missing or invalid SHA-256 lock for ${entry.property}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            entry.file.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                for (int count; (count = stream.read(buffer)) >= 0;) digest.update(buffer, 0, count)
            }
            String actual = digest.digest().collect { String.format('%02x', it) }.join()
            if (actual != entry.expected) {
                throw new GradleException("SHA-256 mismatch for ${entry.property}: expected ${entry.expected}, got ${actual}")
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly files(project.property('dominionsword_jar'))
    compileOnly files(project.property('iaf_jar'))
    compileOnly files(project.property('uranus_jar'))
    // Keep local mod dependencies out of the published jar while making Forge's development
    // client/server runs representative of the real installation.
    runtimeOnly files(project.property('dominionsword_jar'))
    runtimeOnly files(project.property('iaf_jar'))
    runtimeOnly files(project.property('uranus_jar'))
    testImplementation files(project.property('dominionsword_jar'))
    testImplementation files(project.property('iaf_jar'))
    testImplementation files(project.property('uranus_jar'))
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mixin { add sourceSets.main, 'dominionsword_iceandfire_compat.refmap.json' }

test {
    useJUnitPlatform()
}

// Java 17 on Windows reads Gradle worker argument files with the active ANSI code page.
// Carry the URL-encoded non-ASCII checkout/dependency paths through a manifest instead.
def testClasspathJar = tasks.register('testClasspathJar', Jar) {
    archiveFileName = 'dominionsword-iceandfire-compat-test-classpath.jar'
    def checkoutKey = Integer.toHexString(project.projectDir.absolutePath.hashCode())
    destinationDirectory = file("${gradle.gradleUserHomeDir}/caches/dominionsword-iceandfire-compat/test-classpath/${checkoutKey}")
    def encodedTestClasspath = providers.provider {
        sourceSets.test.runtimeClasspath.files.collect { entry ->
            String uri = entry.toURI().toASCIIString()
            String name = entry.name.toLowerCase(java.util.Locale.ROOT)
            return name.endsWith('.jar') || name.endsWith('.zip') || uri.endsWith('/') ? uri : "${uri}/"
        }.join(' ')
    }
    inputs.property('encodedTestClasspath', encodedTestClasspath)
    doFirst { manifest.attributes('Class-Path': encodedTestClasspath.get()) }
}

tasks.withType(Test).configureEach {
    if (System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('windows')
            && project.projectDir.absolutePath.codePoints().anyMatch { it > 127 }) {
        dependsOn testClasspathJar
        classpath = files(testClasspathJar.flatMap { it.archiveFile })
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def props = [minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props + [project: project] }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    from('RELEASE_NOTES.md')
    manifest { attributes(['MixinConfigs': 'dominionsword_iceandfire_compat.mixins.json']) }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyLocalDependencies')
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach { dependsOn tasks.named('verifyLocalDependencies') }
